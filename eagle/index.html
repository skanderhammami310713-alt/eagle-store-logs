<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eagle Store - Order Form</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        
        /* Top Right Logo Styling */
        .logo-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .logo-container img {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        .container {
            background: #141414;
            border: 2px solid #d4af37;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.2);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #d4af37;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #d4af37;
            font-weight: 600;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #d4af37;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 90px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border: none;
            border-radius: 6px;
            color: #0b0b0b;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="Eagle_Store.png" alt="Eagle Store Logo">
    </div>

    <div class="container">
        <h2>Eagle Store Order</h2>
        <form id="orderForm">
            <div class="form-group">
                <label for="discordName">Discord name :</label>
                <input type="text" id="discordName" required placeholder="e.g. Username#0000">
            </div>
            
            <div class="form-group">
                <label for="clientBuy">What the client buy :</label>
                <textarea id="clientBuy" required placeholder="Enter details of the purchase..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">Send</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        const webhookURL = "https://discord.com/api/webhooks/1546134324816908368/075o_EExDcZ4BPE1kRYyhJ8zO1yseNY-1JkNR6wSfloIckBqhIGVQY7cUjBjIf6qhpAK";

        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const discordName = document.getElementById('discordName').value;
            const clientBuy = document.getElementById('clientBuy').value;
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            statusDiv.textContent = '';

            const payload = {
                content: `🦅 **Eagle Store - New Order**\n> **Discord Name:** ${discordName}\n> **What they bought:** ${clientBuy}`
            };

            try {
                const response = await fetch(webhookURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    statusDiv.style.color = '#d4af37';
                    statusDiv.textContent = 'Successfully sent to Discord!';
                    document.getElementById('orderForm').reset();
                } else {
                    throw new Error('Failed to send message.');
                }
            } catch (error) {
                statusDiv.style.color = '#ff4d4d';
                statusDiv.textContent = 'Error sending data. Please try again.';
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send';
            }
        });
    </script>

</body>
</html>
